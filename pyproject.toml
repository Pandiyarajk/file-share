[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-file-server"
version = "1.1.1"
description = "Lightweight HTTP file server with a modern web UI. No third-party dependencies."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Pandiyaraj K", email = "pandiyarajk@live.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["file-server", "http", "upload", "share"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
py-file-server = "py_file_server:main"
pfs = "py_file_server:main"

[tool.hatch.build.targets.wheel]
packages = ["py_file_server"]

[tool.hatch.build.targets.sdist]
include = [
    "py_file_server",
    "README.md",
    "LICENSE",
    "DISCLAIMER.md",
    "pyproject.toml",
]
